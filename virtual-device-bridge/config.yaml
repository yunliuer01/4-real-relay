# 虚拟设备映射桥接器配置
# 作用：把 4 路继电器网关上报的一包属性，拆成多个独立虚拟设备属性上报；
#       并把对各虚拟设备的下行命令聚合回网关控制帧。

mqtt:
  broker: "172.16.4.211"
  port: 9783
  username: "test"
  password: "123456"
  # 桥接器自身 client_id（建议唯一，避免多个实例互顶）
  client_id: "lfx-bridge-01"
  # QoS，保持 1 可防止网络抖动时丢命令
  qos: 1

# 父网关设备（真实继电器/Modbus 网关，4-real-relay 固件）
# 板子固件里 product_id 字段由用户在 portal 网页配置；admin5 在 2026-09-09
# 已把它配成 "relay4_lfx"，与 JetLinks 上 admin5 创建的 `relay4_lfx` 产品一致。
gateway:
  product_id: "relay4_lfx"
  device_id: "7ce8b1c1a7fc"
  # 4-real-relay 固件沿用 Aliyun/OneNet 风格 topic，与子设备用的 JetLinks 风格分开
  topic_mode: "direct"

# 子设备 topic 模式：与 JetLinks 物模型对齐
# "jetlinks" -> /{product_id}/{device_id}/properties/report   （JetLinks 标准，2026-09-09 实测通过）
# "direct"   -> /{product_id}/{device_id}/property/post        （Aliyun/OneNet 风格）
child_topic_mode: "jetlinks"

# ---------------- 继电器通道 → 虚拟设备 ----------------
# 注：product_id/device_id 对应 admin5 在 JetLinks 172.16.4.211:9000 上已创建的
# 7 个 lfx 后缀子设备（2026-09-09），实测它们在
# `/{product_id}/{device_id}/properties/report` 上报即可被 JetLinks 接收并入库。
# 命令下行通过 `/api/device-instance/{did}/property/_write`（不需要产品物模型里有
# functions 段，对应一个 property write 即可）。
relays:
  - channel: 1
    product_id: "lock-lfx"
    device_id: "lock-002-lfx"
    name: "门锁"
    property_map:
      ch1_state: lockState
    event_map:
      switch_change:
        event_id: "unlockRecord"
        data_map:
          channel: sourceChannel
          state: lockState
    command_map:
      # JetLinks 功能调用 / 属性写
      setLock:
        function_id: "set_channel"
        inputs:
          channel: 1
          state: "{value}"
      lockState:
        function_id: "set_channel"
        inputs:
          channel: 1
          state: "{value}"
      # JetLinks 物模型中 lock-lfx 还有 lock / unlock 两个 function（带 switch 入参），
      # 平台"上锁开关"就是发到 lock function。同时映射两条，便于上层两种写法都能控。
      lock:
        function_id: "set_channel"
        inputs:
          channel: 1
          state: true
      unlock:
        function_id: "set_channel"
        inputs:
          channel: 1
          state: false

  - channel: 2
    product_id: "light-lfx-1"
    device_id: "light-003-lfx"
    name: "灯1"
    property_map:
      ch2_state: switch
      ch2_voltage: voltage
      ch2_current: current
      ch2_power: power
    command_map:
      switch:
        function_id: "set_channel"
        inputs:
          channel: 2
          state: "{value}"
      turnOn:
        function_id: "set_channel"
        inputs:
          channel: 2
          state: true
      turnOff:
        function_id: "set_channel"
        inputs:
          channel: 2
          state: false

  - channel: 3
    product_id: "light-lfx-2"
    device_id: "light-004-lfx"
    name: "灯2"
    property_map:
      ch3_state: switch
      ch3_voltage: voltage
      ch3_current: current
      ch3_power: power
    command_map:
      switch:
        function_id: "set_channel"
        inputs:
          channel: 3
          state: "{value}"
      turnOn:
        function_id: "set_channel"
        inputs:
          channel: 3
          state: true
      turnOff:
        function_id: "set_channel"
        inputs:
          channel: 3
          state: false

  - channel: 4
    product_id: "ac-lfx"
    device_id: "ac-002-lfx"
    name: "空调开关"
    property_map:
      ch4_state: powerState
    command_map:
      turnOn:
        function_id: "set_channel"
        inputs:
          channel: 4
          state: true
      turnOff:
        function_id: "set_channel"
        inputs:
          channel: 4
          state: false
      powerState:
        function_id: "set_channel"
        inputs:
          channel: 4
          state: "{value}"
      setPower:
        function_id: "set_channel"
        inputs:
          channel: 4
          state: "{value}"

# ---------------- Modbus 采集值 → 虚拟传感器 ----------------
# source_key 支持两种形式：
#   1) 精确匹配父设备 properties 里的 key，如 s1_temperature
#   2) 通配前缀：s1_* 表示把从站 1 所有 key 映射到同一子设备
sensors:
  # 真实 Modbus 从站 1（温湿度）
  - product_id: "th-lfx"
    device_id: "th-001-lfx"
    name: "温湿度传感器"
    # 把父设备里的 s1_temperature / s1_humidity 等转发到本设备
    source_pattern: "s1_*"
    property_map:
      s1_temperature: temperature
      s1_humidity: humidity

# ---------------- 模拟传感器（不依赖真实硬件） ----------------
# 由桥接器内部定时生成属性并上报，用于演示多设备场景
simulated:
  - product_id: "pir-lfx"
    device_id: "pir-001-lfx"
    name: "人体感应器"
    interval_seconds: 5
    properties:
      - key: occupancy
        type: random_choice
        choices: [0, 1]
        weights: [0.75, 0.25]

  - product_id: "smoke-lfx"
    device_id: "smoke-001-lfx"
    name: "烟雾感应器"
    interval_seconds: 10
    properties:
      - key: smoke
        type: random_int
        min: 0
        max: 80
      - key: alarm
        type: random_choice
        choices: [false, true]
        weights: [0.97, 0.03]

# 可选：REST API 暴露运行状态
http_api:
  enabled: true
  host: "127.0.0.1"
  port: 18080

# ---------------- v6.0.4 网关 MQTT 链路自愈 ----------------
# 板子（ESP32-C3）长时间无对端交互后会进入「TCP 看着 ESTABLISHED、publish 静默
# 丢失」的半死状态：bridge 收不到任何上行属性，但板子 HTTP API 仍然可用。
# 这里定时向父设备下发一帧空操作心跳（functionId=__hb__），板子收到后立刻回
# /event/hb_ack。这样：① 让板子的收/发路径始终有真实往返，不易进入半死；
# ② bridge 能区分「板子真的没数据」和「链路断了」；③ 一旦发现上行停滞，
# 自动把心跳加速到 stall_interval_seconds 把链路拍醒。
# 板子侧配套：超过自身 hb_timeout_s（默认 180s，写在板子 config.json 里）没收到
# 心跳就主动断开重连，无需人工干预。
gateway_heartbeat:
  enabled: true
  interval_seconds: 45          # 常规心跳周期
  stall_after_seconds: 40       # 超过该时长没收到父设备属性 -> 判定上行停滞
  stall_interval_seconds: 10    # 停滞期间的心跳周期（加速"拍醒"）
  function_id: "__hb__"         # 与固件 HEARTBEAT_FUNCTION_ID 保持一致
  # 阈值配对（v6.0.4）：bridge 从 40s 起就把真实停滞秒数 stall_s 随心跳下发，
  # 板子侧默认要等 stall_s >= 60s（板子 config.json 的 stall_reconnect_s 可覆盖）
  # 才主动断开重连。故意留 20s 缓冲：bridge 只是观察者，真正动作由板子决定，
  # 避免「刚连上就被判停滞 -> 立刻重连」的抖动。
